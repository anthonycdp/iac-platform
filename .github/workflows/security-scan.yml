# =============================================================================
# GitHub Actions Workflow: Security Scanning
# =============================================================================
# Runs security scans on infrastructure code including:
# - Checkov for IaC security scanning
# - tfsec for Terraform-specific security checks
# - Trivy for vulnerability scanning

name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Checkov IaC Security Scan
  # ---------------------------------------------------------------------------
  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: policies/checkov/.checkov.yaml
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results/checkov.sarif
          soft_fail: false
          download_external_modules: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('results/checkov.sarif') != '' }}
        with:
          sarif_file: results/checkov.sarif

  # ---------------------------------------------------------------------------
  # tfsec Security Scan
  # ---------------------------------------------------------------------------
  tfsec:
    name: tfsec Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .
          additional_args: --tfvars-file example.tfvars
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Trivy Vulnerability Scan
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          tf-vars: 'example.tfvars'
          ignore-policy: 'policies/trivy/ignore.rego'
