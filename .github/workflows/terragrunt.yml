# =============================================================================
# Terragrunt Workflow
# =============================================================================
# Alternative workflow using Terragrunt for multi-environment deployments.

name: Terragrunt

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.hcl'
      - 'environments/**'
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.hcl'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      command:
        description: 'Terragrunt command'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TG_VERSION: '0.55.0'
  TF_VERSION: '1.15.2'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        environment: [dev]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        uses: gruntwork-io/terragrunt-action@v2
        with:
          terragrunt_version: ${{ env.TG_VERSION }}
          tofu_version: ''
          tf_version: ${{ env.TF_VERSION }}

      - name: Terragrunt Plan
        id: plan
        run: |
          cd environments/${{ matrix.environment }}
          terragrunt run-all plan -no-color 2>&1 | tee plan.txt

      - name: Comment Plan
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/${{ matrix.environment }}/plan.txt', 'utf8');
            const output = `#### Terragrunt Plan - \`${{ matrix.environment }}\`
            \`\`\`
            ${plan.substring(0, 65000)}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Terragrunt
        uses: gruntwork-io/terragrunt-action@v2
        with:
          terragrunt_version: ${{ env.TG_VERSION }}
          tf_version: ${{ env.TF_VERSION }}

      - name: Terragrunt Apply
        run: |
          cd environments/${{ github.event.inputs.environment || 'dev' }}
          terragrunt run-all apply -auto-approve
